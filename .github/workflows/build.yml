name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# tauri-action 创建 Release 草稿需要写权限
permissions:
  contents: write

jobs:
  test:
    name: cargo test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux Tauri 系统依赖
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - run: npm test
      - run: cargo test
        working-directory: src-tauri
      - run: npm run build

  package:
    name: tauri build (${{ matrix.os }})
    needs: test
    # 仅 tag 推送（含手动 dispatch 选择 tag ref）才打包建 Release 草稿；
    # 否则主线推送会以 tagName=main 建草稿甚至创建 main tag
    if: startsWith(github.ref, 'refs/tags/')
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux Tauri 系统依赖
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - name: 校验 tag 与应用版本一致
        shell: bash
        run: |
          node -e '
            const fs = require("fs");
            const tag = process.env.GITHUB_REF_NAME.replace(/^v/, "");
            const conf = require("./src-tauri/tauri.conf.json").version;
            const pkg = require("./package.json").version;
            const cargo = fs.readFileSync("src-tauri/Cargo.toml", "utf8").match(/^version = "([^"]+)"/m)[1];
            console.log({ tag, conf, pkg, cargo });
            if (tag !== conf || tag !== pkg || tag !== cargo) {
              console.error("发版 tag 必须与 package.json / tauri.conf.json / Cargo.toml 的 version 一致，否则 updater 不会提示已安装用户");
              process.exit(1);
            }
          '
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # updater 签名密钥（私钥内容 + 密码，需在 repo Settings → Secrets 配置；
          # 私钥本地存于 ~/.tauri/ccode-updater.key，勿提交 git）
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Ccode ${{ github.ref_name }}'
          releaseDraft: true
