<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mesa</title>
    <style>
      /* 首帧底色：macOS 与 Windows 11 一开始就透明，窗口一出来就是毛玻璃（data-boot-glass，见下）。
         2026-10-30 实测（tauri 2.11 / wry 0.55，录屏逐帧）：wry 在 WKWebView 创建前就关了
         drawsBackground，加载期间（拖慢到 1.7s 也一样）始终透出窗口材质，没有白底层；原先这层
         实心底反而是在已经出现的毛玻璃上盖一块深蓝 / 浅灰，约 0.4s 后才淡回玻璃。
         2026-10-31 Windows 11 同样实测：WebView2 从第一次出画面起就是透明底，直接透出 Mica；
         是否 Windows 11 由 Rust 建窗时注入 __MESA_BOOT_GLASS__（main_window.rs），UA 分不出 10 / 11。
         其他平台（Windows 10、Linux）仍走主题色实心底：跟随应用主题（localStorage.ccodeBootTheme，App 持久化；
         没存过值回落系统外观），400ms 后淡出成磨砂，减弱动态效果时不淡出（宁实不白）。
         ready-to-show 隐藏亮窗方案试过被用户退回：无窗静默期读起来像卡死。 */
      html,
      body,
      #root {
        margin: 0;
        height: 100%;
      }
      html {
        background: #eef0f4;
        animation: boot-frost 0.45s ease-out 0.4s forwards;
      }
      html[data-boot="dark"] {
        background: #11131a;
      }
      @keyframes boot-frost {
        to {
          background: transparent;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        html {
          animation: none;
        }
      }
      html[data-boot-glass] {
        background: transparent;
        animation: none;
      }
      /* React 挂上后交给 App.css：壳层透明，桌面磨砂从侧栏透出。
         这里的启动底不能盖过已挂载的页面。 */
      html:has(#root > :not(.boot-splash)) {
        background: transparent;
        animation: none;
      }
      /* 启动字标：与应用图标「光标 M_」同一个意思——字静止，只有琥珀光标在闪
         （终端里光标闪 = 在等）。光标用图标的品牌琥珀，不跟主题强调色走，同图标。
         整块先透明，0.2s 后才淡入：首屏数据很快就位时直接进应用，不闪一下字；
         慢的时候才看见。React 挂载后由 BootGate 以负 animation-delay 接上两段
         动画的进度（时长改这里要同步改 App.tsx 的 BOOT_* 常量），换手无跳变。 */
      .boot-splash {
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #5d6474;
        /* Windows 没有 SF：给 Segoe UI，否则落到通用 sans-serif（中文系统常是宋体 / 雅黑），字标走样 */
        font-family: -apple-system, "SF Pro", "Segoe UI Variable", "Segoe UI", sans-serif;
        font-size: 22px;
        font-weight: 400;
        letter-spacing: 0.3em;
        opacity: 0;
        animation: boot-show 0.32s ease-out 0.2s forwards;
      }
      html[data-boot="dark"] .boot-splash {
        color: #8c93a3;
      }
      @keyframes boot-show {
        to {
          opacity: 1;
        }
      }
      /* 落在基线上的块状光标 + 一层同色柔光（图标里的荧光屏余辉）；
         字距本身留出与字母间同宽的空，光标不另加外边距。字与光标包在一个 span 里
         走行内排版——直接做 flex 子项光标会被 align-items 居中到 x 高度 */
      .boot-caret {
        display: inline-block;
        width: 0.5em;
        height: 0.14em;
        border-radius: 1px;
        background: #e39a1c;
        box-shadow: 0 0 8px rgba(227, 154, 28, 0.45);
        animation: boot-blink 1.1s ease-in-out infinite;
      }
      html[data-boot="dark"] .boot-caret {
        background: #f5b83d;
        box-shadow: 0 0 10px rgba(245, 184, 61, 0.5);
      }
      /* 亮的时间长、灭得短，转换各约 0.1s：像光标，不像闪烁警示 */
      @keyframes boot-blink {
        0%,
        50% {
          opacity: 1;
        }
        60%,
        90% {
          opacity: 0.15;
        }
        100% {
          opacity: 1;
        }
      }
      /* 换手：应用挂载时字标盖在上面淡出（BootGate 渲染 .boot-handoff 约 0.4s 后卸掉），
         与应用的淡入叠在一起，中间不露空磨砂。z-40 = 页面模态档（压过页头与标题栏，
         低于 toast），不造新档；不接点击。 */
      .boot-handoff {
        position: fixed;
        inset: 0;
        z-index: 40;
        pointer-events: none;
        animation: boot-fadeout 0.3s ease-out forwards;
      }
      @keyframes boot-fadeout {
        to {
          opacity: 0;
        }
      }
      /* 应用挂载后整体淡入——排除字标与换手层，它们有自己的动画 */
      #root > :not(.boot-splash):not(.boot-handoff) {
        animation: boot-fadein 0.3s ease-out;
      }
      @keyframes boot-fadein {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      /* 减弱动态效果：光标常亮不闪；淡入淡出属于溶解、不是位移，保留 */
      @media (prefers-reduced-motion: reduce) {
        .boot-caret {
          animation: none;
        }
      }
    </style>
    <script>
      // 首帧前同步定启动底色（浅/深）。localStorage 不可用（隐私模式等）回落系统外观。
      // macOS 与 Windows 11 不铺实心底，窗口材质直接透出（见上方样式注释）；字标颜色仍按 data-boot 分深浅。
      if (/Macintosh/.test(navigator.userAgent) || window.__MESA_BOOT_GLASS__)
        document.documentElement.dataset.bootGlass = "";
      try {
        var boot = localStorage.getItem("ccodeBootTheme");
        if (boot !== "light" && boot !== "dark") {
          boot = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        document.documentElement.dataset.boot = boot;
      } catch (e) {
        document.documentElement.dataset.boot = matchMedia("(prefers-color-scheme: dark)")
          .matches
          ? "dark"
          : "light";
      }
    </script>
  </head>

  <body>
    <div id="root">
      <!-- 启动时还没有顶栏：整块字标当拖拽区（deep：点到字上也算），否则 Mac / Windows 无标题栏、拖不动窗口 -->
      <div class="boot-splash" data-tauri-drag-region="deep"><span>Mesa<i class="boot-caret"></i></span></div>
    </div>
    <script>
      // Windows：窗口建好先隐身，等启动画面第一帧画完再请 Rust 露出来，不先白一下（main_window.rs，
      // 那边 1 秒兜底）。两次 rAF = 第一帧已经提交；万一 rAF 在隐身时被节流，0.5s 定时器补一次
      if (window.__MESA_BOOT_CLOAK__) {
        var bootShown = false;
        var showBootWindow = function () {
          if (bootShown) return;
          bootShown = true;
          try {
            window.__TAURI_INTERNALS__.invoke("boot_window_painted").catch(function () {});
          } catch (e) {
            /* 调不到就等 Rust 到点露出 */
          }
        };
        requestAnimationFrame(function () {
          requestAnimationFrame(showBootWindow);
        });
        setTimeout(showBootWindow, 500);
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
