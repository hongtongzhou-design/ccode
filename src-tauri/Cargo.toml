[package]
name = "ccode"
version = "0.1.0"
description = "Unified launcher, config center and session monitor for AI coding agents"
authors = ["hongtongzhou-design"]
license = "MIT"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "ccode_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
dirs = "6"
keyring = "3"
portable-pty = "0.9"
uuid = { version = "1", features = ["v4"] }
which = "6"
# gzip/brotli/deflate：部分中转网关无视 Accept-Encoding 强制压缩响应，不解压则 JSON 解析报
# "error decoding response body"；解压库均为纯 Rust 实现，三平台行为一致，不改变 Mac 端既有行为
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip", "brotli", "deflate"] }
rusqlite = { version = "0.32", features = ["bundled"] }
zstd = "0.13"
md5 = "0.7"
toml = "0.8"
zip = "2"
toml_edit = "0.22"
notify = "6"
base64 = "0.22"
trash = "5"
csv = "1"
sysinfo = "0.33"
tauri-plugin-drag = "2.1.1"
