[package]
name = "ccode"
version = "0.1.0"
description = "Unified launcher, config center and session monitor for AI coding agents"
authors = ["泽塔前沿科技（杭州）有限公司"]
license = "Apache-2.0"
edition = "2021"
# 多 bin（主程序 ccode + 浏览器桥 mesa_helper）后 cargo run 必须指明默认目标，
# 否则 tauri dev 起不来（2026-09-17 热更新窗口打不开的根因）
default-run = "ccode"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "ccode_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# macos-private-api：macOS 窗口透明（侧栏桌面磨砂）必需。启用后不能上 Mac App Store，
# Mesa 走 GitHub Release 分发，不走商店。
tauri = { version = "2", features = ["tray-icon", "macos-private-api", "protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# 只经 src/dirs.rs 用（沙盒家目录覆盖）；改名后直接写 dirs:: 编译不过
os_dirs = { package = "dirs", version = "6" }
keyring = "3"
portable-pty = "0.9"
uuid = { version = "1", features = ["v4"] }
which = "6"
# gzip/brotli/deflate：部分中转网关无视 Accept-Encoding 强制压缩响应，不解压则 JSON 解析报
# "error decoding response body"；解压库均为纯 Rust 实现，三平台行为一致，不改变 Mac 端既有行为
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip", "brotli", "deflate"] }
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
zstd = "0.13"
md5 = "0.7"
sha2 = "0.10"
toml = "0.8"
zip = "2"
calamine = { version = "0.26", features = ["dates"] }
encoding_rs = "0.8"
chardetng = "0.1"
toml_edit = "0.22"
notify = "6"
base64 = "0.22"
# 出图核验：要了透明底时解 PNG 数透明像素（已是 tauri 的传递依赖，不新增下载）
png = "0.18"
# 反馈邮箱直发（lettre：SMTP + rustls；附件走 MultiPart，授权码存 keys.json）
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "rustls-tls"] }
trash = "5"
csv = "1"
sysinfo = "0.33"
tauri-plugin-drag = "2.1.1"
# 从手机添加（phone_drop.rs，docs/design-phone-drop.md）：局域网收件小服务 + 扫码二维码 + 选网卡。
# 暴露在局域网上的口子不手写 HTTP 解析；hyper 虽在锁文件里（reqwest 传递依赖），开 server 面更大
tiny_http = "0.12"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
if-addrs = "0.15"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_System_DataExchange", "Win32_UI_Shell", "Win32_System_Diagnostics_Debug", "Win32_System_Power", "Wdk_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Registry", "Win32_Graphics_Dwm"] }

# WKWebView 手势开关只在 macOS 用（inst_access 登录窗）；无条件依赖会让 Linux/Windows 直接编译失败
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
# 订阅 NSWindow 全屏 will 通知（mac_fullscreen.rs）；两者已随 tauri 进依赖图，这里只是直接引用。
# NSLocale：从访达启动时按系统地区补 LANG（process::ensure_utf8_locale）
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "block2", "NSNotification", "NSString", "NSOperation", "NSLocale"] }

# dev 构建下 zstd 的 C 解码按 profile 默认 -O0 编译，冷启动扫 2.8GB 归档压缩档时
# 解压本身就成了大头（2026-10-16 实测：批量滑窗修完后扫描仍 17.5s，其中 codex 16.7s）。
# 只给 zstd 系开优化：一次性重编这三个包，扫描解压回到正常速度，其余依赖保持 debug。
[profile.dev.package.zstd]
opt-level = 3
[profile.dev.package.zstd-safe]
opt-level = 3
[profile.dev.package.zstd-sys]
opt-level = 3
